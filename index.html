<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preload" href="./public/ball.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магический шар от Sleepless Tech</title>
  </head>
  <body>
    <div id="snow"></div>
    <div id="app">
      <section class="header">
        <h1>Магический шар 2025</h1>
        <span>Coder Edition</span>
      </section>
      <p>
        Потряси (если у тебя Android) или нажми на шар, чтобы получить
        предсказание
      </p>

      <div class="ball slide-in-elliptic-top-fwd" id="ball">
        <div class="ball-textbox" id="textbox">
          <div class="initial" id="logo"></div>
          <div class="answer up hide" id="answer">
            <div class="corner corner1"></div>
            <div class="corner corner2"></div>
            <div class="corner corner3"></div>
            <div class="corner corner4"></div>
            <div id="answer-text"></div>
          </div>
        </div>
      </div>
    </div>
    <a href="#" class="share-link invisible" id="share"
      >Поделиться результатом</a
    >
    <footer>Made by jem_jem</footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
